<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đổi tên</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
      font-size: 11.5px;
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* BỐ CỤC CHÍNH 2 CỘT */
    .container {
      display: flex;
      width: 100%;
      height: 100%;
    }

    /* CỘT TRÁI: ĐIỀU KHIỂN & BỘ LỌC */
    .left-col {
      width: 250px;
      min-width: 240px;
      background: #f8fafc;
      border-right: 1px solid #cbd5e1;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 9px;
      box-shadow: 2px 0 8px rgba(0,0,0,0.03);
      overflow-y: auto;
    }

    .form-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .form-group label {
      width: 60px;
      font-size: 11px;
      font-weight: 600;
      color: #334155;
      white-space: nowrap;
    }
    .form-input {
      flex: 1;
      padding: 4px 7px;
      font-size: 11.5px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      background: #ffffff;
      color: #0f172a;
      outline: none;
      transition: border-color 0.15s;
    }
    .form-input:focus {
      border-color: #0284c7;
      box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.15);
    }

    .replace-box {
      border: 1px dashed #cbd5e1;
      border-radius: 6px;
      padding: 8px 6px;
      background: #f1f5f9;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .replace-row {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: #334155;
      cursor: pointer;
    }

    .left-bottom-actions {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-top: 10px;
      border-top: 1px solid #e2e8f0;
    }
    .btn-row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px;
    }

    .btn-action {
      background: #e2e8f0;
      border: 1px solid #cbd5e1;
      color: #334155;
      padding: 5px 8px;
      font-size: 11px;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
      text-align: center;
      transition: all 0.12s;
    }
    .btn-action:hover {
      background: #cbd5e1;
      color: #0f172a;
    }
    .btn-action.primary {
      background: linear-gradient(135deg, #0284c7, #0369a1);
      border-color: #0284c7;
      color: #ffffff;
      font-weight: bold;
    }
    .btn-action.primary:hover {
      background: #0284c7;
      box-shadow: 0 2px 6px rgba(2, 132, 199, 0.3);
    }
    .btn-action.danger {
      background: #fee2e2;
      border-color: #fca5a5;
      color: #b91c1c;
    }
    .btn-action.danger:hover {
      background: #fecaca;
    }

    /* CỘT PHẢI: PRESET & BẢNG NÚT BẤM NHANH */
    .right-col {
      flex: 1;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: #ffffff;
      overflow-y: auto;
    }

    .preset-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid #e2e8f0;
    }
    .preset-label {
      font-weight: 700;
      color: #334155;
      font-size: 11.5px;
    }
    .preset-select {
      flex: 1;
      padding: 4px 8px;
      font-size: 11.5px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      background: #f8fafc;
      font-weight: 600;
      color: #0f172a;
    }
    .btn-icon {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      padding: 3px 7px;
      font-size: 12px;
      cursor: pointer;
    }
    .btn-icon:hover {
      background: #e2e8f0;
    }

    .section-title {
      font-size: 10.5px;
      font-weight: 800;
      color: #64748b;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      margin-top: 2px;
    }

    /* LƯỚI 3 CỘT NÚT TÊN MODULE */
    .grid-modules {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    .btn-module {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      padding: 6px 4px;
      font-size: 11px;
      font-weight: 600;
      color: #1e293b;
      cursor: pointer;
      text-align: center;
      transition: all 0.12s ease;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .btn-module:hover {
      background: #e0f2fe;
      border-color: #38bdf8;
      color: #0369a1;
      transform: translateY(-1px);
    }
    .btn-module:active {
      background: #0284c7;
      color: #fff;
    }

    /* LƯỚI 3 CỘT NÚT TÊN TẤM VÁN */
    .grid-parts-wrapper {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      flex: 1;
    }
    .part-col {
      display: flex;
      flex-direction: column;
      gap: 4.5px;
    }
    .btn-part {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      padding: 5px 4px;
      font-size: 11px;
      font-weight: 500;
      color: #1e293b;
      cursor: pointer;
      text-align: center;
      transition: all 0.1s ease;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .btn-part:hover {
      background: #fef3c7;
      border-color: #f59e0b;
      color: #92400e;
      transform: translateY(-1px);
      font-weight: 700;
    }
    .btn-part:active {
      background: #d97706;
      color: #ffffff;
      border-color: #b45309;
    }

    /* THANH TRẠNG THÁI & PREVIEW ĐÁY */
    .preview-bar {
      margin-top: 4px;
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      border-radius: 4px;
      padding: 5px 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      color: #475569;
    }
    .preview-name {
      font-weight: 700;
      color: #0284c7;
      font-size: 11px;
    }
    .status-text {
      font-size: 10px;
      color: #10b981;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- CỘT TRÁI: FORM ĐỔI TÊN & REPLACE -->
    <div class="left-col">
      <div class="form-group">
        <label for="inp-code1">Code N.1</label>
        <input type="text" id="inp-code1" class="form-input" placeholder="Ví dụ: TB (Tủ Bếp)">
      </div>
      <div class="form-group">
        <label for="inp-code2">Code N.2</label>
        <input type="text" id="inp-code2" class="form-input" placeholder="Ví dụ: M01 (Khoang 1)">
      </div>
      <div class="form-group">
        <label for="inp-code3">Code N.3</label>
        <input type="text" id="inp-code3" class="form-input" placeholder="">
      </div>

      <div class="replace-box">
        <div style="font-weight:bold; font-size:10.5px; color:#475569;">Thay thế chuỗi:</div>
        <div class="replace-row">
          <input type="text" id="inp-rep-from" class="form-input" placeholder="Tìm kiếm...">
          <span style="color:#64748b; font-weight:bold;">→</span>
          <input type="text" id="inp-rep-to" class="form-input" placeholder="Thay bằng...">
        </div>
        <button type="button" class="btn-action" id="btn-do-replace" style="margin-top:2px; padding:3px 6px;">Thực Hiện Thay Thế</button>
      </div>

      <div class="form-group" style="flex-direction:column; align-items:stretch; gap:3px;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <label for="inp-part-name" style="width:auto;">Đổi tên:</label>
          <label class="checkbox-row">
            <input type="checkbox" id="chk-auto-index" checked> Số thứ tự
          </label>
        </div>
        <input type="text" id="inp-part-name" class="form-input" placeholder="Tên tấm ván hoặc module..." style="font-weight:bold; color:#0369a1;">
      </div>

      <div class="form-group">
        <label for="inp-prefix">Tiền tố</label>
        <input type="text" id="inp-prefix" class="form-input" placeholder="">
      </div>
      <div class="form-group">
        <label for="inp-suffix">Hậu tố</label>
        <input type="text" id="inp-suffix" class="form-input" placeholder="">
      </div>

      <!-- Nút hành động đáy cột trái -->
      <div class="left-bottom-actions">
        <div class="btn-row-2">
          <button type="button" class="btn-action" id="btn-clear-id" title="Xóa mã [P01], [P02] để đánh số lại">Xóa ID</button>
          <button type="button" class="btn-action" id="btn-clean-copy" title="Xóa các hậu tố #1, #2, _copy do copy sinh ra">Xóa copy xxx</button>
        </div>
        <div class="btn-row-2">
          <button type="button" class="btn-action" id="btn-undo" title="Hoàn tác (Undo)">Undo</button>
          <button type="button" class="btn-action primary" id="btn-apply" title="Áp dụng đổi tên cho đối tượng đang chọn">Apply</button>
        </div>
      </div>
    </div>

    <!-- CỘT PHẢI: PRESET & LƯỚI NÚT CHỌN NHANH -->
    <div class="right-col">
      <!-- Thanh Preset -->
      <div class="preset-bar">
        <span class="preset-label">Preset:</span>
        <select id="preset-selector" class="preset-select">
          <option value="Huy">Huy (Chuẩn xưởng anh Huy)</option>
          <option value="Chill AI Decor">Chill AI Decor (Tiêu chuẩn)</option>
        </select>
        <button type="button" class="btn-icon" id="btn-preset-settings" title="Cài đặt Preset">⚙️</button>
      </div>

      <!-- Nhóm 1: Tên Cụm Module (12 nút) -->
      <div class="section-title">📦 Cụm Module / Khối Tủ:</div>
      <div class="grid-modules" id="container-modules">
        <!-- Render bằng Javascript -->
      </div>

      <!-- Nhóm 2: Tên Tấm Ván Chi Tiết (3 cột nút) -->
      <div class="section-title" style="margin-top:6px;">🪵 Tên Tấm Ván Chi Tiết (Click để gán ngay):</div>
      <div class="grid-parts-wrapper">
        <div class="part-col" id="col-parts-1"></div>
        <div class="part-col" id="col-parts-2"></div>
        <div class="part-col" id="col-parts-3"></div>
      </div>

      <!-- Thanh Preview -->
      <div class="preview-bar">
        <div>Xem trước: <span id="preview-final-name" class="preview-name">_Hông Trái_ 1</span></div>
        <div id="status-msg" class="status-text">💡 Kích chọn ván trong SketchUp rồi click nút tên</div>
      </div>
    </div>
  </div>

  <script>
    let currentPresets = {
      "Huy": {
        "modules": [
          "_Giường_", "_Tủ Áo_", "_Bếp_",
          "_Tủ Giày_", "_Kệ TV_", "_Tủ Cầu Thang_",
          "_Tủ Lavabo_", "_Bàn Học_", "_Kệ Sách_",
          "_Tủ Trang Trí_", "_Ốp Tường_", "_Bàn Trang Điểm_"
        ],
        "parts": [
          "_H1_", "_H4_", "_Đáy_", "_Sấn Giữa_", "_Len Chân_", "_Hậu_", "1", "4", "7", "10",
          "_Cánh Mở_", "_NK_", "Phải", "_Đáy NK_", "_Thanh Gia Giảm_", "Xà Sau_", "Thùng Ngăn Kéo_",
          "_H2_", "_H5_", "_Hông Trái_", "_Đáy_", "_Len Chân Giữa_", "_Hậu Trước_", "2", "5", "8",
          "_Xương Cong_", "_Cánh Lùa_", "_Thành_", "Trước", "_Chỉ Nóc_", "_Thanh Chặn_", "Xà Trước_",
          "_H3_", "_Nóc_", "_Hông Phải_", "_Đợt_", "_Len Chân Sau_", "_Nóc_", "3", "6", "9",
          "_Cánh NK_", "Cánh Chết", "Trái", "Sau", "Chỉ Hông_", "_Trang Trí Ông Táo_", "Thanh Gắn Lề_"
        ]
      }
    };

    let activePresetKey = "Huy";

    function callRuby(callbackName, data) {
      const jsonStr = JSON.stringify(data || {});
      if (window.sketchup && typeof window.sketchup[callbackName] === 'function') {
        window.sketchup[callbackName](jsonStr);
      } else if (typeof sketchup !== 'undefined' && typeof sketchup[callbackName] === 'function') {
        sketchup[callbackName](jsonStr);
      }
    }

    function getFormParams() {
      return {
        code_n1: (document.getElementById('inp-code1')?.value || '').trim(),
        code_n2: (document.getElementById('inp-code2')?.value || '').trim(),
        code_n3: (document.getElementById('inp-code3')?.value || '').trim(),
        part_name: (document.getElementById('inp-part-name')?.value || '').trim(),
        prefix: (document.getElementById('inp-prefix')?.value || '').trim(),
        suffix: (document.getElementById('inp-suffix')?.value || '').trim(),
        auto_index: document.getElementById('chk-auto-index')?.checked || false,
        selection_only: true
      };
    }

    function renderPresetButtons() {
      const preset = currentPresets[activePresetKey] || currentPresets["Huy"];
      if (!preset) return;

      // 1. Render Modules (12 nút)
      const modContainer = document.getElementById('container-modules');
      if (modContainer) {
        modContainer.innerHTML = '';
        (preset.modules || []).forEach(modName => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'btn-module';
          btn.textContent = modName;
          btn.title = `Gán tên cụm: ${modName}`;
          btn.addEventListener('click', () => {
            const inp = document.getElementById('inp-part-name');
            if (inp) inp.value = modName;
            updatePreview();

            // Gửi toàn bộ form cùng tên nút vừa chọn để Ruby cập nhật nhãn 3D ngay lập tức
            const fullParams = getFormParams();
            fullParams.name = modName;
            fullParams.is_module = true;
            callRuby('rename_quick', fullParams);
          });
          modContainer.appendChild(btn);
        });
      }

      // 2. Render Parts (chia đều 3 cột)
      const col1 = document.getElementById('col-parts-1');
      const col2 = document.getElementById('col-parts-2');
      const col3 = document.getElementById('col-parts-3');
      if (col1 && col2 && col3) {
        col1.innerHTML = '';
        col2.innerHTML = '';
        col3.innerHTML = '';

        const parts = preset.parts || [];
        parts.forEach((pName, index) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'btn-part';
          btn.textContent = pName;
          btn.title = `Click để gán ngay: ${pName}`;
          btn.addEventListener('click', () => {
            const inp = document.getElementById('inp-part-name');
            if (inp) inp.value = pName;
            updatePreview();

            const fullParams = getFormParams();
            fullParams.name = pName;
            fullParams.is_module = false;
            callRuby('rename_quick', fullParams);
          });

          if (index < 17) {
            col1.appendChild(btn);
          } else if (index < 33) {
            col2.appendChild(btn);
          } else {
            col3.appendChild(btn);
          }
        });
      }
    }

    function updatePreview() {
      const p = getFormParams();
      const code1 = p.code_n1;
      const code2 = p.code_n2;
      const code3 = p.code_n3;
      const partName = p.part_name || '_Đáy_';
      const prefix = p.prefix;
      const suffix = p.suffix;
      const autoIdx = p.auto_index;

      const parts = [];
      if (prefix) parts.push(prefix);
      if (code1) parts.push(code1);
      if (code2) parts.push(code2);
      if (code3) parts.push(code3);
      if (partName) parts.push(partName);
      if (autoIdx) parts.push('1');
      if (suffix) parts.push(suffix);

      let previewStr = parts.join('_').replace(/__+/g, '_');
      previewStr = previewStr.replace(/^_|_$/g, '');
      const previewEl = document.getElementById('preview-final-name');
      if (previewEl) previewEl.textContent = previewStr;
    }

    ['inp-code1', 'inp-code2', 'inp-code3', 'inp-part-name', 'inp-prefix', 'inp-suffix'].forEach(id => {
      document.getElementById(id)?.addEventListener('input', updatePreview);
    });
    document.getElementById('chk-auto-index')?.addEventListener('change', updatePreview);

    document.getElementById('btn-apply')?.addEventListener('click', () => {
      const params = getFormParams();
      callRuby('rename_apply', params);
    });

    document.getElementById('btn-do-replace')?.addEventListener('click', () => {
      const findStr = document.getElementById('inp-rep-from')?.value || '';
      const repStr = document.getElementById('inp-rep-to')?.value || '';
      if (!findStr) {
        alert('Vui lòng nhập chuỗi cần tìm!');
        return;
      }
      callRuby('rename_replace', { find: findStr, replace: repStr, selection_only: true });
    });

    document.getElementById('btn-clean-copy')?.addEventListener('click', () => {
      callRuby('rename_clean_copy', { selection_only: true });
    });

    document.getElementById('btn-clear-id')?.addEventListener('click', () => {
      callRuby('rename_clear_id', { selection_only: true });
    });

    document.getElementById('btn-undo')?.addEventListener('click', () => {
      callRuby('rename_undo', {});
    });

    document.getElementById('preset-selector')?.addEventListener('change', (e) => {
      activePresetKey = e.target.value;
      renderPresetButtons();
    });

    document.getElementById('btn-preset-settings')?.addEventListener('click', () => {
      alert('Chức năng Preset xưởng chuẩn ABF: Đã cấu hình đầy đủ từ điển tên mộc xưởng anh Huy!');
    });

    window.onRenameCompleted = function(result) {
      const msgEl = document.getElementById('status-msg');
      if (msgEl && result) {
        if (result.status === 'warning') {
          msgEl.textContent = `⚠️ ${result.message}`;
          msgEl.style.color = '#f59e0b';
        } else if (result.status === 'success') {
          msgEl.textContent = `✓ ${result.message}`;
          msgEl.style.color = '#10b981';
          msgEl.style.fontWeight = 'bold';
        } else if (result.status === 'error') {
          msgEl.textContent = `❌ ${result.message}`;
          msgEl.style.color = '#ef4444';
        }
      }
    };

    window.onPresetsLoaded = function(presetsData) {
      if (presetsData && typeof presetsData === 'object') {
        currentPresets = presetsData;
        renderPresetButtons();
      }
    };

    renderPresetButtons();
    updatePreview();
    callRuby('get_rename_presets', {});
  </script>
</body>
</html>
